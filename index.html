<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Quiz Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container" id="container">
        <h1 class="text-center my-4">Korean Quiz Generator</h1>
        <div class="text-center" id="formContainer">
            <form class="px-5" id="quizGeneratorForm">
                <div class="mb-3">
                    <label for="numQuestions" class="form-label">Number of Questions</label>
                    <input type="number" class="form-control" id="numQuestions" name="numQuestions" min="5" max="50" value="10">
                </div>
                <div class="mb-3">
                    <label for="difficulty" class="form-label">Difficulty</label>
                    <select class="form-select" id="difficulty" name="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select class="form-select" id="category" name="category">
                        <option value="vocabulary">Vocabulary</option>
                        <option value="grammar">Grammar</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="quiz-concept" class="form-label">Grammar/Vocabulary</label>
                    <input type="text" lang="ko" class="form-control" id="quizConcept" name="quiz-concept" placeholder="단어나 문법을 입력하세요">
                </div>

                <div class="vocabulary-list mb-3" id="vocabularyList"></div>
                <div class="grammar-list mb-3" id="grammarList"></div>
                <button class="btn btn-primary">Generate Quiz</button>
            </form>
        </div>
    </div>

    <script src="./script/main.js"></script>
</body>
</html>
